name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tasky
          POSTGRES_PASSWORD: tasky
          POSTGRES_DB: tasky
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tasky -d tasky"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://tasky:tasky@localhost:5432/tasky
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-fedcba9876543210
      CORS_ORIGINS: http://localhost:5173
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:types
      - run: npx prisma migrate deploy
      - run: npm run seed
      - run: npm run build
      - run: npm run test:e2e
